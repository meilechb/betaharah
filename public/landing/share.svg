<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Betaharah: the mikvah calendar that does the counting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ebe0" />
      <stop offset="1" stop-color="#e4dccb" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2a3c6e" stop-opacity="0.16" />
      <stop offset="1" stop-color="#2a3c6e" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14283f" flood-opacity="0.18" />
    </filter>
    <path id="drop" d="M12 2.7 17.7 8.4a8 8 0 1 1-11.3 0z" />
    <path id="moon" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <!-- wordmark -->
    <g transform="translate(72 72)">
      <circle cx="26" cy="26" r="24" fill="#2a3c6e" />
      <g fill="none" stroke="#fffcf8" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 2) scale(0.214)">
        <path d="M 53 98.2 C 72 108, 92 108, 112 94 C 132 80, 152 80, 171 98" stroke-width="7" />
        <path d="M 53 134.7 C 72 142, 92 142, 112 125 C 132 108, 152 108, 171 135" stroke-width="6" />
      </g>
      <text x="68" y="36" font-size="30" font-weight="700" fill="#1c2230">Betaharah</text>
    </g>
    <text x="72" y="236" font-size="60" font-weight="800" fill="#1c2230" letter-spacing="-2">The mikvah</text>
    <text x="72" y="306" font-size="60" font-weight="800" fill="#1c2230" letter-spacing="-2">calendar that does</text>
    <text x="72" y="376" font-size="60" font-weight="800" fill="#1c2230" letter-spacing="-2">the counting.</text>
    <text x="72" y="440" font-size="24" fill="#3e465c">Hefsek taharah, seven clean days, mikvah night</text>
    <text x="72" y="474" font-size="24" fill="#3e465c">and onot perishah, by your customs.</text>
    <g transform="translate(72 520)">
      <rect width="336" height="48" rx="24" fill="#ffffff" stroke="#e2ded5" />
      <circle cx="26" cy="24" r="6" fill="#2e7d4f" />
      <text x="44" y="31" font-size="19" font-weight="600" fill="#1c2230">Free · Works by text message</text>
    </g>

    <!-- the month -->
    <g transform="translate(690 92)" filter="url(#shadow)">
      <rect width="440" height="446" rx="20" fill="#ffffff" stroke="#e2ded5" />
    </g>
    <g transform="translate(690 92)">
      <text x="220" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#1c2230">December 2026</text>
      <text x="220" y="70" text-anchor="middle" font-size="14" fill="#3e465c">Kislev – Tevet</text>
      <g font-size="13" fill="#3e465c" text-anchor="middle">
        <text x="47" y="104">Sun</text><text x="105" y="104">Mon</text><text x="163" y="104">Tue</text><text x="221" y="104">Wed</text><text x="279" y="104">Thu</text><text x="337" y="104">Fri</text><text x="395" y="104" font-weight="700" fill="#1c2230">Sat</text>
      </g>
      <!-- cells: 54 wide, 58 tall, 4 gap; x0 = 20, y0 = 116 -->
      <g fill="#ffffff" stroke="#e2ded5">
        <rect x="136" y="116" width="54" height="58" rx="6" /><rect x="194" y="116" width="54" height="58" rx="6" /><rect x="310" y="116" width="54" height="58" rx="6" />
        <rect x="20" y="178" width="54" height="58" rx="6" /><rect x="78" y="178" width="54" height="58" rx="6" /><rect x="136" y="178" width="54" height="58" rx="6" /><rect x="194" y="178" width="54" height="58" rx="6" /><rect x="252" y="178" width="54" height="58" rx="6" /><rect x="310" y="178" width="54" height="58" rx="6" />
        <rect x="20" y="240" width="54" height="58" rx="6" /><rect x="78" y="240" width="54" height="58" rx="6" /><rect x="136" y="240" width="54" height="58" rx="6" /><rect x="194" y="240" width="54" height="58" rx="6" /><rect x="252" y="240" width="54" height="58" rx="6" /><rect x="310" y="240" width="54" height="58" rx="6" />
        <rect x="20" y="302" width="54" height="58" rx="6" /><rect x="78" y="302" width="54" height="58" rx="6" /><rect x="136" y="302" width="54" height="58" rx="6" /><rect x="194" y="302" width="54" height="58" rx="6" /><rect x="252" y="302" width="54" height="58" rx="6" /><rect x="310" y="302" width="54" height="58" rx="6" />
        <rect x="20" y="364" width="54" height="58" rx="6" /><rect x="78" y="364" width="54" height="58" rx="6" /><rect x="136" y="364" width="54" height="58" rx="6" /><rect x="194" y="364" width="54" height="58" rx="6" /><rect x="252" y="364" width="54" height="58" rx="6" />
      </g>
      <!-- Shabbat -->
      <g fill="#f1ebe0" stroke="#ddd4c4">
        <rect x="368" y="116" width="54" height="58" rx="6" /><rect x="368" y="240" width="54" height="58" rx="6" /><rect x="368" y="302" width="54" height="58" rx="6" />
      </g>
      <g fill="#858a95"><rect x="369" y="116" width="52" height="3" /><rect x="369" y="240" width="52" height="3" /><rect x="369" y="302" width="52" height="3" /><rect x="369" y="178" width="52" height="3" /></g>
      <!-- today, selected -->
      <rect x="252" y="116" width="54" height="58" rx="6" fill="#ffffff" stroke="#2a3c6e" stroke-width="2" />
      <rect x="368" y="178" width="54" height="58" rx="6" fill="#e6eaf4" stroke="#2a3c6e" stroke-width="3" />
      <!-- day numbers -->
      <g font-size="14" font-weight="700" fill="#1c2230">
        <text x="142" y="134">1</text><text x="200" y="134">2</text><text x="316" y="134">4</text><text x="374" y="136">5</text>
        <text x="26" y="196">6</text><text x="84" y="196">7</text><text x="142" y="196">8</text><text x="200" y="196">9</text><text x="258" y="196">10</text><text x="316" y="196">11</text><text x="374" y="198">12</text>
        <text x="26" y="258">13</text><text x="84" y="258">14</text><text x="142" y="258">15</text><text x="200" y="258">16</text><text x="258" y="258">17</text><text x="316" y="258">18</text><text x="374" y="260">19</text>
        <text x="26" y="320">20</text><text x="84" y="320">21</text><text x="142" y="320">22</text><text x="200" y="320">23</text><text x="258" y="320">24</text><text x="316" y="320">25</text><text x="374" y="322">26</text>
        <text x="26" y="382">27</text><text x="84" y="382">28</text><text x="142" y="382">29</text><text x="200" y="382">30</text><text x="258" y="382">31</text>
      </g>
      <circle cx="263" cy="129" r="9" fill="#2a3c6e" /><text x="263" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
      <!-- marks -->
      <use href="#drop" transform="translate(140 148) scale(0.8)" fill="#c2185b" />
      <rect x="374" y="152" width="17" height="17" rx="5" fill="none" stroke="#9a7700" stroke-width="2" stroke-dasharray="3 2" /><text x="382.5" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#9a7700">H</text>
      <g fill="none" stroke="#1f7a8c" stroke-width="2" stroke-dasharray="3 2">
        <circle cx="34.5" cy="221" r="8" /><circle cx="92.5" cy="221" r="8" /><circle cx="150.5" cy="221" r="8" /><circle cx="208.5" cy="221" r="8" /><circle cx="266.5" cy="221" r="8" /><circle cx="324.5" cy="221" r="8" /><circle cx="382.5" cy="221" r="8" />
      </g>
      <g font-size="10" font-weight="700" fill="#1f7a8c" text-anchor="middle">
        <text x="34.5" y="225">1</text><text x="92.5" y="225">2</text><text x="150.5" y="225">3</text><text x="208.5" y="225">4</text><text x="266.5" y="225">5</text><text x="324.5" y="225">6</text><text x="382.5" y="225">7</text>
      </g>
      <circle cx="404.5" cy="221" r="8" fill="none" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="3 2" /><text x="404.5" y="225" text-anchor="middle" font-size="10" font-weight="700" fill="#2e7d4f">M</text>
      <use href="#moon" transform="translate(140 398) scale(0.72)" fill="#c62828" />
      <g transform="translate(198 398) scale(0.72)" fill="#c62828" stroke="#c62828" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></g>
      <use href="#moon" transform="translate(218 398) scale(0.72)" fill="#c62828" />
      <g transform="translate(256 398) scale(0.72)" fill="#c62828" stroke="#c62828" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></g>
    </g>
  </g>
</svg>
